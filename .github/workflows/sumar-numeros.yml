name: CI/CD Calculadora Django con Seleccion

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Descargar repositorio
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instalar Django y renderizar index.html
      run: |
        pip install django
        python sumar.py

    - name: Subir artefacto para GitHub Pages
      uses: actions/upload-pages-artifact@v3
      with:
        path: '.'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Publicar en GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4